# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overriden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

spring:
    data:
      rest:
        base-path: /api
        max-page-size: 50
        default-page-size: 10
        return-body-on-create: false
        return-body-on-update: false
      mongodb:
        auto-index-creation: true
        representation:
          # Spring Data MongoDB 5 has no default anymore, keep the former default
          big-decimal: string
    mongodb:
      representation:
        # Spring Boot 4 has no default anymore, keep the former Spring Boot 3 default
        uuid: java-legacy
    jackson:
      # keep the JSON format of Spring Boot 3 (e.g. property order) for the frontend and API clients
      use-jackson2-defaults: true
    messages:
        basename: classpath:/i18n/messages
    thymeleaf:
        mode: HTML
    servlet:
      multipart:
        max-file-size: 15MB
        max-request-size: 15MB
    # read by ElasticsearchClientConfiguration and SearchResource (no Spring Boot auto-configuration)
    elasticsearch:
      rest:
        uris:
        - http://localhost:9200

mongock:
  # change sets use the raw MongoDatabase, keep Mongock 4 behaviour (no transactions)
  transactional: false
  migration-scan-package:
    - eu.dzhw.fdz.metadatamanagement.common.repository.changelogs
    - eu.dzhw.fdz.metadatamanagement.usermanagement.repository.changelogs

springdoc:
  swagger-ui:
    path: /api/swagger-ui.html
    disable-swagger-default-url: true
    url: /api/api-docs
    query-config-enabled: false
  api-docs:
    path: /api/api-docs
    enabled: true

logging:
  level:
    root: warn
    eu.dzhw.fdz.metadatamanagement: info
    org.zalando.logbook: trace

server:
    port: 8080
    tomcat:
        remoteip:
          remote-ip-header: x-forwarded-for
          protocol-header: x-forwarded-proto
    compression:
        enabled: true
        mime-types: text/html,text/xml,text/plain,text/css, application/javascript, application/json
    servlet:
        encoding:
          force: false

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
        - info
        - health
        - configprops
        - metrics
        - prometheus
  endpoint:
    health:
      show-details: always
      group:
        dbs:
          show-details: always
          include:
            - elasticsearch
            - mongo
  info:
    git:
      mode: full
  health:
    elasticsearch:
      enabled: false
    ping:
      enabled: false

javers:
  algorithm: levenshtein_distance
  snapshots-cache-size: 0

metadatamanagement:
  elasticsearch:
    version: 7.12.1
  ordermanagement:
    email: daniel@dzhw.eu
  projectmanagement:
    email: daniel@dzhw.eu
  dara-pid:
    enabled: true # needs to exist in all config profiles for the MDM Maven plugin to work correctly
    statusPollIntervalInSeconds: 60
    abortAfterMinutesElapsed: 120
  dlp:
    endpoint: https://stage.fdz.dzhw.eu/{language}/form/data-usage-application
  report-task:
    start-command: java -jar /app/report-task.jar --task.id=%1$s --task.version=%2$s --task.language=%3$s --task.onBehalfOf=%4$s --task.type=%5$s
    service-name: metadatamanagement-worker
    container-name: report-task

# ===================================================================
# JHipster specific properties
# ===================================================================

jhipster:
    mail:
        from: fdz-feedback@dzhw.eu
    security:
        authentication:
            oauth:
                clientid: metadatamanagementapp
                secret: $2a$04$1M3yLuQsTu2dJGl0Rj60c.d9dLt1hHpRNMLzilziLM50VgGJ52ckG
    http:
        cache: # Used by the CachingHttpHeadersFilter
            timeToLiveInDays: 31
    metrics: # DropWizard Metrics configuration, used by MetricsConfiguration
        jmx.enabled: false
        spark:
            enabled: false
            host: localhost
            port: 9999
        graphite:
            enabled: false
            host: localhost
            port: 2003
            prefix: metadatamanagement

logbook:
  predicate:
    include:
      - path: /api/orders/**
  filter.enabled: true
  format.style: json

tweet:
  consumerkey: ${vcap.services.tweet.credentials.consumerkey}
  consumersecret: ${vcap.services.tweet.credentials.consumersecret}
  oauthtoken: ${vcap.services.tweet.credentials.oauthtoken}
  oauthtokensecret: ${vcap.services.tweet.credentials.oauthtokensecret}
  endpointurl: "https://api.twitter.com/2/tweets"
  mediaendpointurl: "https://upload.twitter.com/1.1/media/upload.json"
  imagedir:  "./mdm-frontend/src"
