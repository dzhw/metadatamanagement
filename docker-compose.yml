# start all external services for the metadatamanagement app
# mongo and elasticsearch will be available on its default ports
# docker-compose start
services:
  mongodb:
    image: mongo:8.3
    container_name: mongodb
    volumes:
      - ./data/mongodb/db:/data/db
      # mongodump directories to restore, see README
      - ./dump:/dump:ro
    ports:
      - "27017:27017"
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.6
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false   # plain http locally, no certificates needed
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    # ensure group has rwx on this directory
    volumes:
      - ./data/elasticsearch/data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    deploy:
      resources:
        limits:
          memory: 1024m
  maildev:
    image: djfarrelly/maildev
    container_name: maildev
    # goto localhost:8081 for viewing mail sent via smtp
    ports:
      - "8081:80"
      - "1025:25"
  identity_provider:
    image: sanduhrs/identity-provider
    container_name: identity-provider
    ports:
      - "8082:80"
